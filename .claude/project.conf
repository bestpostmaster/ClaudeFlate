# Configuration du projet pour les garde-fous (sourcée par hooks/guard-subagent.sh).
# C'est LE point d'adaptation à votre technologie : le reste du squelette est neutre.
#
# TOUT EST VIDE PAR DÉFAUT : tant que ce fichier n'est pas renseigné, les agents ne
# peuvent lancer aucune commande de validation (seule la lecture de l'historique du dépôt
# est autorisée) et aucun fichier sensible n'est protégé. À renseigner à l'import.
#
# Chaque *_RE est une regex étendue Bash appliquée à la commande entière (ou au chemin
# relatif au projet pour *_PATHS_RE, au nom de fichier pour SENSITIVE_FILES_RE).
# Une regex vide désactive la catégorie. Les commandes doivent être SIMPLES : le filtre
# (non configurable) refuse ; & | < > $ ` ( ) { } \ guillemets et sauts de ligne.
# Ne jamais autoriser de shell, d'interpréteur libre, d'installation ou d'écriture Git.
#
# Exemple de forme (à remplacer par vos vraies commandes) :
#   VALIDATION_RE='^<outil> (check|test|build)( -- [^ ].*)?$'

# Validations (contrôle qualité, tests, build) autorisées pour le coder ET le reviewer.
VALIDATION_RE=''

# Commandes qui modifient des fichiers (formatage, correction automatique, génération
# de changements de schéma) : coder uniquement.
CODER_RE=''

# Inspection de l'environnement (état, logs), en lecture seule.
INSPECT_RE=''

# Commandes à risque (installation, démarrage de services…) que l'humain peut autoriser
# une à une dans .claude/feature-approvals.json. Vide = aucune exception possible.
# Les commandes contenant le mot sh, bash ou git sont toujours refusées ici ;
# EXCEPTION_DENY_RE ajoute vos propres mots ou options interdits.
EXCEPTION_RE=''
EXCEPTION_DENY_RE=''

# Fichiers dont la modification exige une autorisation humaine exacte : manifestes de
# dépendances, lockfiles, scripts de build, configuration d'infrastructure ou de CI.
# SENSITIVE_FILES_RE s'applique au nom de fichier, SENSITIVE_PATHS_RE au chemin relatif.
SENSITIVE_FILES_RE=''
SENSITIVE_PATHS_RE=''

# Chemins totalement interdits d'édition aux agents (fichiers d'éditeur, dossiers générés…).
PROTECTED_PATHS_RE=''

# Fichiers versionnés qu'il est interdit de modifier (créer un nouveau fichier à la place),
# typiquement l'historique des changements de schéma de base de données.
IMMUTABLE_PATHS_RE=''

# Rappel affiché dans le message de refus d'une commande.
ALLOWED_HINT='Voir les commandes autorisées dans .claude/project.conf.'
