# Configuration du projet pour les garde-fous (sourcée par hooks/guard-subagent.sh).
# C'est LE point d'adaptation à votre stack : le reste du squelette est générique.
# Valeur par défaut : cibles `make` (fonctionne avec tout langage ou framework).
# Autres outillages : copier un fichier de presets/ ici (docker-compose-npm.conf, host-npm.conf…).
#
# Chaque *_RE est une regex étendue Bash appliquée à la commande entière (une seule commande
# simple : pas de ; & | < > $ ` ( ) { } \ guillemets ni saut de ligne, ce filtre est non configurable).
# Une regex vide désactive la catégorie. Ne jamais autoriser de shell, d'interpréteur libre,
# d'installation ou d'écriture Git.

# Validations lecture/exécution de tests autorisées pour le coder ET le reviewer.
VALIDATION_RE='^make (check|lint|format-check|typecheck|test|test-cov|test-e2e|build)$'

# Commandes qui modifient les fichiers (formatage, correction lint, migrations) : coder uniquement.
CODER_RE='^make (format|lint-fix)$'

# Inspection de l'environnement (état/logs des services), lecture seule.
INSPECT_RE=''

# Commandes à risque (installation, démarrage de services…) que l'humain peut autoriser une à une
# dans .claude/feature-approvals.json. Vide = aucune exception de commande possible.
EXCEPTION_RE=''
EXCEPTION_DENY_RE=''

# Fichiers/chemins sensibles supplémentaires (modification soumise à autorisation humaine).
# Les manifestes, lockfiles, Makefile, Dockerfile, compose et CI courants sont déjà couverts.
EXTRA_SENSITIVE_FILES_RE=''
EXTRA_SENSITIVE_PATHS_RE=''

# Fichiers versionnés qu'il est interdit de modifier (créer-un-nouveau-fichier) : migrations.
# Valeur par défaut : migrations?/, db/migrate/, alembic/versions/.
# IMMUTABLE_PATHS_RE='(^|/)(db/migrate|migrations?|alembic/versions)/'

# Rappel affiché dans le message de refus.
ALLOWED_HINT='Autorisé : make (check|lint|format-check|typecheck|test|test-cov|test-e2e|build) ; coder : make (format|lint-fix).'
