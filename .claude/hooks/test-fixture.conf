# Configuration FICTIVE pour le harnais de tests : l'outil `projectctl` n'existe pas.
# Elle prouve que les garde-fous fonctionnent avec n'importe quel outillage déclaré.

VALIDATION_RE='^projectctl (check|test|build|e2e)( -- [^ ].*)?$'
CODER_RE='^projectctl (format|fix)$|^projectctl schema (apply|revert|show)$|^projectctl schema (generate|create) -- db/changes/[A-Za-z0-9_-]+$'
INSPECT_RE='^projectctl status$|^projectctl logs --tail [0-9]+ [a-z]+$'
EXCEPTION_RE='^projectctl (install( [A-Za-z0-9_./:=@,+~-]+)*|start( [a-z]+)*)$'
EXCEPTION_DENY_RE='(^| )(--entrypoint|--privileged|run-script)( |$)'
SENSITIVE_FILES_RE='^(deps\.cfg|deps\.lock|Buildfile|infra\.cfg|infra\.cfg\.[a-z]+)$'
SENSITIVE_PATHS_RE='^(\.ci|ops)/|/\.ci/'
PROTECTED_PATHS_RE='(^|/)\.editor/'
IMMUTABLE_PATHS_RE='^zone-a/db/changes/'
ALLOWED_HINT='Autorisé : projectctl check|test|build|e2e ; coder : projectctl format|fix|schema ... ; projectctl status|logs --tail N <service>.'
