# Préréglage : projet Node/npm exécuté directement sur l'hôte (sans conteneur).
# Usage : cp .claude/presets/host-npm.conf .claude/project.conf

VALIDATION_RE='^npm (test|run (check|lint|format:check|typecheck|test|test:cov|test:e2e|build))( -- [^ ].*)?$'
CODER_RE='^npm run (format|lint:fix)$'
INSPECT_RE=''
EXCEPTION_RE='^npm (install|uninstall)( [A-Za-z0-9_./:=@,+~-]+)*$'
EXCEPTION_DENY_RE=''
ALLOWED_HINT='Autorisé : npm (test | run check|lint|format:check|typecheck|test|test:cov|test:e2e|build) [-- args] ; coder : npm run format|lint:fix.'
