# Préréglage : services Docker Compose `back` / `front` (Node/npm), PostgreSQL et Redis.
# Usage : cp .claude/presets/docker-compose-npm.conf .claude/project.conf
# Adapter les noms de services (back|front) et les scripts npm à votre projet.

_dexec='^docker compose exec( -T)? (back|front) npm '
_common='(test|run (check|lint|format:check|typecheck|test|test:cov|test:e2e|build))'
_rest='( -- [^ ].*)?'

VALIDATION_RE="${_dexec}${_common}${_rest}\$"
CODER_RE="${_dexec}run (format|lint:fix)\$|^docker compose exec( -T)? back npm run migration:(run|revert|show)\$|^docker compose exec( -T)? back npm run migration:(generate|create) -- src/database/migrations/[A-Za-z0-9_-]+\$"
INSPECT_RE='^docker compose ps$|^docker compose logs --tail [0-9]+ (back|front|worker|postgres|redis)$'
EXCEPTION_RE='^docker compose (exec( -T)? (back|front) npm (install|uninstall)( [A-Za-z0-9_./:=@,+~-]+)*|up( -d)?( --build)?( (back|front|worker|postgres|redis))*|build( (back|front|worker))*|restart( (back|front|worker|postgres|redis))+|run --rm --no-deps (back|front) npm (test|run (check|lint|format:check|typecheck|test|test:cov|test:e2e|build))( -- [A-Za-z0-9_./:=@,+~ -]+)?)$'
EXCEPTION_DENY_RE=''
IMMUTABLE_PATHS_RE='^back/src/database/migrations/'
ALLOWED_HINT='Autorisé : docker compose exec [-T] <back|front> npm (test | run check|lint|format:check|typecheck|test|test:cov|test:e2e|build) [-- args] ; coder : npm run format|lint:fix|migration:* ; docker compose ps|logs --tail N <service>.'
